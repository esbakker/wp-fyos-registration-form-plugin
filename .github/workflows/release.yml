name: Release

# Runs on every push to main/master.
#
# The version in the plugin header is the single source of truth. This workflow
# never writes to the repository: it reads that version, and if no release for
# it exists yet, builds the zip and publishes a release. The tag is created by
# the release API at the pushed commit, not by a git push, so a branch ruleset
# protecting main does not get in the way.
#
# Bump the version as part of your change — `bash bump.sh patch|minor|major`,
# or .\bump.ps1 on Windows — and the push that carries it publishes the release.
# A push whose version is already released simply does nothing.

on:
  push:
    branches: [main, master]

permissions:
  contents: write   # needed to create the tag and the release

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      # ------------------------------------------------------------------ #
      # 1. Checkout                                                         #
      # ------------------------------------------------------------------ #
      - name: Checkout
        uses: actions/checkout@v4

      # ------------------------------------------------------------------ #
      # 2. Read the version out of the plugin header                        #
      # ------------------------------------------------------------------ #
      - name: Read version
        id: version
        run: |
          FILE="fyos-registration-form.php"

          # Portable sed — works on Ubuntu and macOS without -P (Perl regex).
          VERSION=$(sed -n 's/.*\* Version:[[:space:]]*\([0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*\).*/\1/p' \
                        "$FILE" | head -1)

          if [ -z "$VERSION" ]; then
            echo "Error: could not read version from $FILE" >&2
            exit 1
          fi

          # The header and the PHP constant must agree, or the plugin reports
          # one version to WordPress and another in its admin screens.
          CONST=$(sed -n "s/.*define( 'FRF_VERSION', '\([0-9.]*\)' );.*/\1/p" "$FILE" | head -1)

          if [ "$VERSION" != "$CONST" ]; then
            echo "Error: header version ($VERSION) and FRF_VERSION ($CONST) disagree." >&2
            echo "Run bump.sh so both are updated together." >&2
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Plugin version: $VERSION"

      # ------------------------------------------------------------------ #
      # 3. Skip quietly when this version was already released              #
      # ------------------------------------------------------------------ #
      - name: Check whether the tag already exists
        id: tag
        run: |
          TAG="v${{ steps.version.outputs.version }}"

          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "$TAG is already released — nothing to do."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "$TAG is new — a release will be published."
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      # ------------------------------------------------------------------ #
      # 4. Build the distributable zip                                      #
      # ------------------------------------------------------------------ #
      - name: Build zip
        if: steps.tag.outputs.exists == 'false'
        run: bash build-zip.sh

      # ------------------------------------------------------------------ #
      # 5. Publish the release — this creates the tag at the pushed commit  #
      # ------------------------------------------------------------------ #
      - name: Create GitHub release
        if: steps.tag.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name:     ${{ steps.tag.outputs.tag }}
          target_commitish: ${{ github.sha }}
          body: |
            **Commit:** ${{ github.event.head_commit.message }}
          files: fyos-registration-form.zip
          fail_on_unmatched_files: true
